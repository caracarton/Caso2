#Aquí hacemos el volumen persistente. Elegimos la versión de la api, tipo de recurso, nombre del pvc, ponemos el disco en modo de acceso ReadWriteOnce y damos 1gigabyte de almacenamiento
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
#Aquí hacemos el deployment. damos la versión de la api, tipo de recurso, nombre de deployment, numero de réplicas, seleccionamos los pods con la app apache, creamos la etiqueta apache y la aplicamos a los pods creados por este deployment
#elegimos el nombre del contenedor de dentro del pod, el puerto interno, la ruta donde montar el volumen, nombre de dicho volumen, definición de dicho volumen y el claim name es para hacer referencia al PVC creado en la parte de antes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
      - name: apache
        image: testacr1sergiomiralles.azurecr.io/apache:casopractico2
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: "/usr/local/apache2/htdocs"
          name: apache-storage
      volumes:
      - name: apache-storage
        persistentVolumeClaim:
          claimName: apache-pvc
---
#Aquí ponemos la api del service, el timpo de recurso es un servicio de red para exponer los pods, elegimos el nombre del servicio. Creamos el load balancer para exponer el pod a internet con una ip publica, conectamos con los pods con la etiqueta apache
#ponemos el puerto 80 para exponerlo y luego el puerto donde se dirige el tráfico que entra.
apiVersion: v1
kind: Service
metadata:
  name: apache-service
spec:
  type: LoadBalancer
  selector:
    app: apache
  ports:
  - port: 80
    targetPort: 80
